version: 2
updates:
- package-ecosystem: maven
  directory: "/"
  schedule:
    interval: daily
    time: "04:00"
    timezone: "Europe/Berlin"
  open-pull-requests-limit: 10
  cooldown:
    default-days: 3
    semver-major-days: 7
    semver-minor-days: 3
    semver-patch-days: 1
  ignore:
  # smallrye-config must track the release io.quarkus:quarkus-bom is built
  # against, not the newest available. Quarkus' deployment classes are compiled
  # against a specific release, so a newer *coherent* stack still fails
  # augmentation with an IllegalAccessError on ConfigMappingLoader - and the
  # requireSameVersions guard cannot catch it, because nothing is split.
  # Bump this together with version.quarkus, never on its own.
  - dependency-name: "io.smallrye.config:*"

- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: daily
    timezone: "Europe/Berlin"
  open-pull-requests-limit: 10
  # Only `default-days`: the `semver-*-days` keys are rejected for the
  # github-actions ecosystem, and one rejected key invalidates the whole file,
  # which disables version updates for the entire repo.
  cooldown:
    default-days: 3
